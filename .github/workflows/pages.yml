name: Deploy Pages

# Explicit Actions-based GitHub Pages deploy. Runs on every push to main —
# including the Airtable sync bot's commits, so newly synced data goes live
# — and can be run by hand via workflow_dispatch.
#
# Loop guard: this workflow only checks out the repo and calls the Pages
# deploy actions; it never commits or pushes anything. It cannot retrigger
# process-data.yml (that workflow only runs on `schedule` and
# `workflow_dispatch`, never on `push`) and it cannot retrigger itself.
#
# Pages is on build_type: workflow (verified against the Pages API on
# 2026-08-10), so this is the live deploy path for a human push to main —
# not an inert workflow waiting on a switch, as this comment previously
# claimed. process-data.yml deploys its own bot commits, because a push made
# with GITHUB_TOKEN cannot trigger this one. See CLAUDE.md §9.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Standard Pages concurrency group: let one deploy finish before the next
# starts, but never cancel a deploy that's already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Prepare site directory
        # No build step — this is a static site. Copy only what's actually
        # served (index.html, styles.css, script.js, assets/, data/) into a
        # clean directory so node_modules/, tests/, scripts/, .github/ and
        # repo metadata (CLAUDE.md, package.json, .env, ...) never reach the
        # deployed artifact.
        run: |
          mkdir _site
          cp index.html styles.css script.js _site/
          cp -r assets _site/assets
          cp -r data _site/data

      - name: Set up Pages
        uses: actions/configure-pages@v6

      # upload-pages-artifact and deploy-pages are a matched pair: v5 of the
      # deploy action expects the artifact format v5 produces. Bump them
      # together or the deploy fails to find its artifact.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
