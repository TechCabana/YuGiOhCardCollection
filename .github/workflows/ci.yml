name: CI

# Gate for pull requests targeting main: install dependencies and run the
# Vitest suite. A red build here can block merge in Trello `process Review`
# (CLAUDE.md §6.1 rule 4), and the "Run tests" job below is the name to add
# as a required status check once the owner enables that in branch
# protection.
#
# Loop guard: this workflow listens for `pull_request` only — there is no
# `push` trigger. process-data.yml commits straight to `main` on a
# schedule/workflow_dispatch and never opens a PR, so that commit cannot
# fire a `pull_request` event and this workflow never runs for it. The
# sync commit deliberately carries no `[skip ci]` tag: that string skips
# every push/pull_request workflow repo-wide for the commit, which would
# also block pages.yml's push-triggered deploy — the event-type mismatch
# above is what actually (and safely) prevents this workflow from firing.

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Matches the version the repo is developed against (README: Node
          # 24.x), so CI cannot pass on a runtime nobody actually uses.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
