name: Sync Airtable

# Pulls the collection from Airtable into data/cards.json and commits it when
# the content actually changed. The token stays in GitHub Secrets and never
# reaches the browser.

on:
  schedule:
    # 06:00 UTC daily. Adjust freely; the collection changes rarely.
    - cron: '0 6 * * *'
  workflow_dispatch:

# Prevent two syncs racing to commit the same file.
concurrency:
  group: sync-airtable
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_ID: ${{ secrets.AIRTABLE_TABLE_ID }}
        run: node scripts/sync-airtable.mjs

      - name: Verify the result still loads
        # A syntactically valid but structurally wrong file would break the
        # live site, so validate before committing rather than after.
        run: |
          node -e "
            const cards = JSON.parse(require('fs').readFileSync('data/cards.json','utf8'));
            if (!Array.isArray(cards)) throw new Error('cards.json is not an array');
            if (cards.length === 0) throw new Error('cards.json is empty');
            const bad = cards.filter(c => !c.name || !c.type || !c.rarity);
            if (bad.length) throw new Error(bad.length + ' card(s) missing required fields');
            console.log('Validated ' + cards.length + ' card(s).');
          "

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain data/cards.json)" ]; then
            echo "No change to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json
          # No [skip ci] here: that string skips every push/pull_request-triggered
          # workflow for the commit, not just this one. ci.yml only listens on
          # pull_request, so a direct push can never retrigger it (event-type
          # mismatch alone is sufficient). pages.yml *does* listen on push to
          # main and is the whole reason this commit exists — [skip ci] would
          # silently stop the deploy once build_type flips to "workflow".
          git commit -m "chore: sync collection from Airtable"
          git push
